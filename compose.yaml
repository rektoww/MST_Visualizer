services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME не указан}
      POSTGRES_USER: ${DB_USER:?DB_USER не указан}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не указан}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      MST_GRAPH_DIR: /app/data/graphs
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data/graphs:/app/data/graphs
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
